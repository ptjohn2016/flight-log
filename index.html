/* ── Day tiles ────────────────────────────────────────────────────────── */
function dayVisual(dateStr) {
  const ds = entriesOnDate(dateStr);
  const closure = ds.find(e => e.kind === "closure");
  const away    = ds.find(e => e.kind === "away");
  const wxBlock = ds.find(e => e.kind === "weather");
  const lessons = ds.filter(isTraining).filter(e => e.status !== "cancelled");
  const cancelled = ds.filter(e => e.status === "cancelled" && isTraining(e));
  const baseState = baseClosedOn(dateStr);
  const lead = lessons.sort((a,b) => (a.start || "") < (b.start || "") ? -1 : 1)[0];

  /* Default: a plain, quiet day. Anything with something on it gets the
     status tint, so the strip reads as colour-on-white rather than a wall
     of dark boxes. A booked lesson is the loudest thing on the screen —
     that's the bit you actually want to see. */
  const v = { bg:"var(--surface)", border:"var(--line)", num:"var(--tx)", dow:"var(--tx3)", mon:"var(--tx4)",
              tag:"", tagColour:"var(--tx3)", hatch:false, lessons, cancelled,
              entry: lead || closure || away || wxBlock || cancelled[0] || null };

  const paint = (t, opts) => Object.assign(v, {
    bg: t.bg, border: t.line, num: t.ink, dow: t.ink, mon: t.ink, tagColour: t.ink
  }, opts || {});

  if (lead) {
    const s = statusOf(lead.status);
    paint(s);
    v.tag = fmtTime(lead.start) || s.l;
    if (lessons.length > 1) v.tag += " +" + (lessons.length - 1);
  } else if (away) {
    paint(TOK.away, { hatch:true });
    v.tag = (away.notes || "Away").slice(0, 9);
  } else if (closure) {
    paint(TOK.closed, { hatch:true });
    v.tag = (closure.notes || "Closed").slice(0, 9);
  } else if (wxBlock) {
    paint(TOK.weather, { hatch:true });
    v.tag = "⛈";
  } else if (cancelled.length) {
    paint(statusOf("cancelled"));
    v.tag = "Cancelled";
  } else if (baseState === "closed") {
    paint(TOK.closed, { hatch:true });
    v.tag = "Closed";
  } else if (baseState === "restricted") {
    paint(TOK.restricted, { hatch:true });
    v.tag = "Restr.";
  }
  return v;
}

function renderCalStrip() {
  const start = new Date(); start.setHours(0,0,0,0);
  const cells = [];
  for (let i = 0; i < 92; i++) {
    const d = addDays(start, i), key = dkey(d), v = dayVisual(key);
    const isToday = i === 0;
    cells.push(`
      <button class="day ${v.hatch ? "hatched" : ""} ${isToday ? "today" : ""}"
              style="background:${v.bg};border-color:${v.border}" onclick="onDayTap('${key}')">
        <span class="dow" style="color:${v.dow}">${DOW[d.getDay()]}</span>
        <span class="dnum" style="color:${v.num}">${d.getDate()}</span>
        <span class="dmon" style="color:${v.mon}">${MON[d.getMonth()]}</span>
        ${v.tag ? `<span class="dtag" style="color:${v.tagColour}">${esc(v.tag)}</span>` : ""}
      </button>`);
  }
  return `<div class="calstrip">${cells.join("")}</div>`;
}

function renderMonthGrid() {
  const base = new Date(); base.setDate(1); base.setHours(0,0,0,0);
  base.setMonth(base.getMonth() + state.ui.monthOffset);
  const first = new Date(base);
  const startOffset = (first.getDay() + 6) % 7;              // Monday-first
  const gridStart = addDays(first, -startOffset);
  const todayK = todayKey();
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = addDays(gridStart, i), key = dkey(d), v = dayVisual(key);
    const out = d.getMonth() !== base.getMonth();
    cells.push(`
      <button class="cell ${v.hatch ? "hatched" : ""} ${out ? "out" : ""} ${key === todayK ? "today" : ""}"
              style="background:${v.bg};border-color:${v.border}" onclick="onDayTap('${key}')">
        <span class="n" style="color:${v.num}">${d.getDate()}</span>
        ${v.tag ? `<span class="m" style="color:${v.tagColour}">${esc(v.tag.slice(0,6))}</span>` : ""}
      </button>`);
  }
  return `
    <div class="row-b mb3" style="padding:0 2px">
      <button class="icon-btn" onclick="shiftMonth(-1)">‹</button>
      <strong>${MON[base.getMonth()]} ${base.getFullYear()}</strong>
      <button class="icon-btn" onclick="shiftMonth(1)">›</button>
    </div>
    <div class="monthgrid">
      ${["M","T","W","T","F","S","S"].map(d => `<div class="dow-h">${d}</div>`).join("")}
      ${cells.join("")}
    </div>`;
}

/* ── Entry card ───────────────────────────────────────────────────────── */
function entryCard(e) {
  const s = statusOf(e.status);
  const k = KINDS[e.kind];
  const flown = e.rec && recTotalMins(e.rec) > 0;
  const exs = (e.exercises || []).map(id => EXERCISES.find(x => x.id === id)).filter(Boolean);
  const w = slotWindow(e);
  /* Whether this entry has ever been handed to the calendar. Worth showing:
     with .ics files the calendar doesn't follow later edits by itself, so a
     changed lesson needs re-adding. */
  const exported = (e.icsSeq || 0) > 0;
  const staleCal = exported && e.calExportedAt && e.updatedAt > e.calExportedAt;

  if (isBlocking(e)) {
    const tk = e.kind === "away" ? TOK.away : e.kind === "closure" ? TOK.closed : TOK.weather;
    const colour = tk.ink;
    const range = e.kind === "away" && e.dateEnd && e.dateEnd !== e.date
      ? fmtDateShort(e.date) + " → " + fmtDateShort(e.dateEnd) : fmtDateLong(e.date);
    return `<div class="sc" onclick="openEntry('${escJs(e.id)}')">
      <span class="bar" style="background:${tk.mark}"></span>
      <div class="body">
        <div class="tiny mono" style="color:${colour}">${esc(range)}</div>
        <div class="mt2" style="font-weight:700;color:${colour}">${k.icon} ${esc(k.label)}</div>
        ${e.notes ? `<div class="tiny muted mt2">${esc(e.notes)}</div>` : ""}
      </div>
      <div class="acts"><button class="icon-btn" onclick="event.stopPropagation();deleteEntry('${escJs(e.id)}')">✕</button></div>
    </div>`;
  }

  const upcoming = e.date >= todayKey() && (e.status === "confirmed" || e.status === "tentative");
  const wx = upcoming ? wxAt(e.date, e.start) : null;
  const soloPlanned = exs.some(x => /^17|^18[cd]/.test(x.ref));
  const a = wx ? assess(wx, soloPlanned) : null;

  return `<div class="sc ${e.status === "cancelled" ? "dim" : ""}" onclick="openEntry('${escJs(e.id)}')">
    <span class="bar" style="background:${s.mark}"></span>
    <div class="body">
      <div class="row mb2" style="gap:7px;flex-wrap:wrap">
        <span class="tiny mono" style="color:${s.ink}">${esc(fmtDateLong(e.date))}</span>
        ${e.start ? `<span class="tiny mono muted">${esc(w.start)}–${esc(w.end)}</span>` : ""}
        <span class="chip" style="color:${s.ink};background:${s.bg};border-color:${s.line}"><span class="dot" style="background:${s.mark}"></span>${s.l}</span>
        ${staleCal ? `<span class="chip" style="color:var(--s-tentative-ink);background:var(--s-tentative-bg);border-color:var(--s-tentative-line)" title="Changed since you added it — update the event in your calendar">📅 changed</span>`
          : exported ? `<span class="chip" style="color:var(--tx3);border-color:var(--line)" title="Added to your calendar">📅</span>` : ""}
        ${e.kind === "exam" && e.status === "completed" ? resultChip(e.examResult) : ""}
      </div>
      <div style="font-weight:700;font-size:14.5px;${e.status === "cancelled" ? "text-decoration:line-through" : ""}">
        ${k.icon} ${esc(entryTitle(e))}
      </div>
      ${exs.length ? `<div class="tags mt2">${exs.slice(0,4).map(x =>
          `<span class="tag" style="min-height:26px;padding:3px 9px;font-size:11px">Ex ${esc(x.ref)}</span>`).join("")}
          ${exs.length > 4 ? `<span class="tag" style="min-height:26px;padding:3px 9px;font-size:11px">+${exs.length-4}</span>` : ""}</div>` : ""}
      <div class="row tiny muted mt2" style="gap:12px;flex-wrap:wrap">
        ${e.instructor ? `<span>👤 ${esc(e.instructor)}</span>` : ""}
        ${e.aircraftReg ? `<span class="mono">${esc(e.aircraftReg)}</span>` : ""}
        ${flown ? `<span style="color:${s.ink};font-weight:800">${hhmm(recTotalMins(e.rec))} logged</span>` : ""}
        ${flown && recP1Mins(e.rec) > 0 ? `<span style="color:var(--violet-ink)">P1 ${hhmm(recP1Mins(e.rec))}</span>` : ""}
        ${flown && e.rec.landings ? `<span>${esc(e.rec.landings)} ldg</span>` : ""}
      </div>
      ${a ? `<div class="row mt3" style="gap:7px;flex-wrap:wrap">
              ${verdictChip(a.verdict)}
              ${a.best ? `<span class="chip" style="color:var(--tx2);border-color:var(--line)">RWY ${esc(a.best.rwy)} · ${a.best.cross.toFixed(0)} kt xw</span>` : ""}
            </div>` : ""}
      ${e.status === "completed" && !flown && e.kind === "flight"
        ? `<div class="note warn mt3 tiny">No flight record yet — tap to add off/on blocks and landings.</div>` : ""}
      ${e.notes ? `<div class="tiny muted mt2 clamp2">${esc(e.notes)}</div>` : ""}
    </div>
    <div class="acts">
      <button class="icon-btn" title="Advance status" onclick="event.stopPropagation();cycleStatus('${escJs(e.id)}')">⟳</button>
      <button class="icon-btn" title="Calendar" onclick="event.stopPropagation();calendarAction('${escJs(e.id)}')">📅</button>
      <button class="icon-btn" style="color:var(--bad-ink)" onclick="event.stopPropagation();deleteEntry('${escJs(e.id)}')">✕</button>
    </div>
  </div>`;
}

function entryTitle(e) {
  if (e.kind === "exam") {
    const x = EXAMS.find(z => z.id === e.examId) || MILESTONES.find(z => z.id === e.examId);
    return x ? x.name : "Exam";
  }
  const exs = (e.exercises || []).map(id => EXERCISES.find(x => x.id === id)).filter(Boolean);
  if (exs.length === 1) return "Ex " + exs[0].ref + " — " + exs[0].name;
  if (exs.length > 1)   return exs.length + " exercises · " + exs.map(x => "Ex " + x.ref).join(", ");
  return e.kind === "ground" ? "Ground school" : "Flying lesson";
}
function resultChip(r) {
  if (r === "pass") return `<span class="chip" style="color:var(--s-confirmed-ink);background:var(--s-confirmed-bg);border-color:var(--s-confirmed-line)">✓ Pass</span>`;
  if (r === "fail") return `<span class="chip" style="color:var(--s-cancelled-ink);background:var(--s-cancelled-bg);border-color:var(--s-cancelled-line)">✕ Fail</span>`;
  return `<span class="chip" style="color:var(--tx3);border-color:var(--line)">Pending</span>`;
}

/* ── Tab: Schedule ────────────────────────────────────────────────────── */
function renderSchedule() {
  const today = todayKey();
  const next = state.entries
    .filter(e => isTraining(e) && e.date >= today && (e.status === "confirmed" || e.status === "tentative"))
    .sort((a,b) => (a.date + (a.start||"")) < (b.date + (b.start||"")) ? -1 : 1)[0];
  const up = nextUp();
  const t = totals();

  const FILTERS = [
    ["upcoming","Upcoming"], ["all","All"], ["needsrecord","Needs record"],
    ["confirmed","Confirmed"], ["tentative","Tentative"], ["completed","Completed"],
    ["cancelled","Cancelled"], ["blocked","Blocked days"]
  ];
  let list = state.entries.filter(e => {
    switch (state.ui.filter) {
      case "all":         return true;
      case "upcoming":    return isTraining(e) && e.date >= today && ["confirmed","tentative"].includes(e.status);
      case "needsrecord": return e.kind === "flight" && e.status === "completed" && (!e.rec || recTotalMins(e.rec) === 0);
      case "blocked":     return isBlocking(e);
      default:            return e.status === state.ui.filter && isTraining(e);

  });

  return `
  <div class="card flush mb3">

    ${state.ui.calMode === "strip" ? renderCalStrip() : `<div style="padding:0 var(--s4) var(--s4)">${renderMonthGrid()}</div>`}
    <div class="row tiny" style="gap:11px;padding:0 var(--s4) var(--s3);flex-wrap:wrap">
      ${STATUSES.map(s => `<span style="color:${s.ink};font-weight:700"><span style="color:${s.mark}">●</span> ${s.l}</span>`).join("")}
      <span style="color:${TOK.away.ink};font-weight:700"><span style="color:${TOK.away.mark}">●</span> Away</span>
      <span style="color:${TOK.closed.ink};font-weight:700"><span style="color:${TOK.closed.mark}">●</span> Closed</span>
    </div>
  </div>

  <div class="split">
    <div class="side stack">
      ${next ? `
        <div class="card">
          <div class="eyebrow mb2">Next lesson</div>
          <div style="font-size:17px;font-weight:800">${esc(fmtDateShort(next.date))}${next.start ? " · " + esc(next.start) : ""}</div>
          <div class="small muted2 mt2">${esc(entryTitle(next))}</div>
          ${nextWeatherBlock(next)}
          <div class="row mt3" style="gap:6px">
            <button class="btn sm" style="flex:1" onclick="openEntry('${escJs(next.id)}')">Open</button>
            <button class="btn sm" style="flex:1" onclick="openPlanFor('${escJs(next.id)}')">Plan it</button>
          </div>
        </div>` : `
        <div class="card">
          <div class="eyebrow mb2">Next lesson</div>
          <div class="small muted">Nothing booked.</div>
          <button class="btn primary block mt3" onclick="openEntry(null,'flight')">Book a lesson</button>
        </div>`}

      <div class="g3">
        ${statTile("Hours", hhmm(t.totalMins), "var(--accent-ink)")}
        ${statTile("Solo", hhmm(t.p1Mins), "var(--violet-ink)")}
        ${statTile("Landings", String(t.landings), "var(--ok-ink)")}
      </div>

      ${up ? `
        <div class="card tight">
          <div class="eyebrow mb2">Suggested next exercise</div>
          <div style="font-weight:700">Ex ${esc(up.ex.ref)} — ${esc(up.ex.name)}</div>
          <div class="tiny muted mt2">${esc(up.phase.label)}</div>
        </div>` : `
        <div class="card tight"><div class="eyebrow mb2">Syllabus</div><div class="small" style="color:var(--ok-ink)">Every exercise covered.</div></div>`}
    </div>

    <div class="main">
      <div class="row-b mb3" style="gap:8px">
        <div class="filters">
          ${FILTERS.map(([v,l]) => `<button class="fbtn ${state.ui.filter === v ? "on" : ""}" onclick="setFilter('${v}')">${l}</button>`).join("")}
        </div>
        <button class="fbtn" style="flex-shrink:0" onclick="toggleSort()">${state.ui.sortAsc ? "↑" : "↓"}</button>

          : `<div class="empty"><span class="ic">✈</span>Nothing here.<br>Tap <strong>+ New</strong> to add something.</div>`}

}

function statTile(label, value, colour) {
  return `<div class="panel" style="text-align:center">
    <div class="xtiny muted" style="text-transform:uppercase;letter-spacing:1px">${esc(label)}</div>
    <div class="num mt2" style="font-size:18px;color:${colour}">${esc(value)}</div>
  </div>`;
}

function nextWeatherBlock(e) {
  const w = wxAt(e.date, e.start);
  if (!w) return state.wx.hourly ? `<div class="tiny muted mt3">Outside the 7-day forecast window.</div>`
                                 : `<div class="tiny muted mt3">Weather not loaded — open the Plan tab.</div>`;
  const soloPlanned = (e.exercises || []).some(id => { const x = EXERCISES.find(z => z.id === id); return x && /^17|^18[cd]/.test(x.ref); });
  const a = assess(w, soloPlanned);
  return `<div class="mt3">${verdictChip(a.verdict)}
    <div class="tiny muted mt2 mono">${Math.round(w.windKt)}kt${w.gustKt && w.gustKt > w.windKt + 2 ? " G" + Math.round(w.gustKt) : ""} / ${pad3(trueToMag(w.windDir))}°M${a.best ? " · RWY " + a.best.rwy + " " + a.best.cross.toFixed(0) + "kt xw" : ""}</div>
  </div>`;
}
function pad3(n) { return String(Math.round(n)).padStart(3, "0"); }

/* ── Tab: Progress ────────────────────────────────────────────────────── */
function renderProgress() {
  const T = state.settings.targets, t = totals();
  const phases = phaseProgress();
  const exams = examState(), miles = milestoneState();
  const doneEx = phases.reduce((a,p) => a + p.done, 0), totEx = phases.reduce((a,p) => a + p.total, 0);

  /* Two steps per bar: the readable ink for the figure, the saturated mark for
     the fill. Using one value for both makes either the text too pale or the
     bar too dull. */
  const bar = (label, mins, targetH, ink, mark) => {
    const h = mins / 60, pct = targetH > 0 ? Math.min(100, h / targetH * 100) : 0;
    const done = pct >= 100;
    return `<div class="panel mb2">
      <div class="row-b" style="align-items:baseline">
        <span class="eyebrow">${esc(label)}${done ? " ✓" : ""}</span>
        <span class="mono small" style="color:${ink};font-weight:700">${hhmm(mins)}<span class="muted" style="font-weight:400"> / ${targetH}:00</span></span>
      </div>
      <div class="bar-t"><div class="bar-f" style="width:${pct}%;background:linear-gradient(90deg, color-mix(in srgb, ${mark} 70%, white), ${mark})"></div></div>
    </div>`;
  };

  return `
  <div class="note info mb3">Targets default to commonly published NPPL(M) minimums. Confirm the current figures against CAP 804 and your school, then adjust them in Settings.</div>

  <div class="row-b mb3"><h2>Flight hours</h2><button class="icon-btn" onclick="openSettings('targets')">⚙</button></div>
  ${bar("Total flight time", t.totalMins, T.totalHours, "var(--accent-ink)", "var(--accent)")}
  ${bar("Solo (P1)", t.p1Mins, T.soloHours, "var(--violet-ink)", "var(--s-away-mark)")}
  ${bar("Solo cross-country", t.soloXCMins, T.soloXCHours, "var(--ok-ink)", "var(--s-confirmed-mark)")}

  <div class="card tight mb4 row-b" style="gap:10px">
    <div style="min-width:0">
      <div class="eyebrow">Qualifying cross-country</div>
      <div class="tiny muted mt2">≥ ${T.qualifyingXCNm} nm with full-stop landings away from base. Longest flown: ${longestXC() || 0} nm.</div>
    </div>

function planSlotCard(e) {

    <div class="small">${esc(fmtDateLong(e.date))} — outside the 7-day forecast window.</div></div>`;
  const soloPlanned = (e.exercises || []).some(id => { const x = EXERCISES.find(z => z.id === id); return x && /^17|^18[cd]/.test(x.ref); });
  const a = assess(w, soloPlanned);
  return `
  <div class="card mb3">
    <div class="row-b mb3" style="flex-wrap:wrap;gap:8px">
      <div style="min-width:0">

        <div class="small muted2 mt2">${esc(entryTitle(e))}</div>
      </div>

    </div>
    <div class="wx-grid">

        <div class="g2">
          ${miniStat("Wind", Math.round(w.windKt) + " kt " + pad3(trueToMag(w.windDir)) + "°M")}
          ${miniStat("Gusts", w.gustKt != null ? Math.round(w.gustKt) + " kt" : "—")}
          ${miniStat("Cloud base", w.cloudBaseFt != null ? w.cloudBaseFt + " ft" : "—")}

        </div>
        <div class="panel">

          ${a.comps.map((c, i) => {
            const g = a.gustComps ? a.gustComps[i] : null;
            return `<div class="row-b" style="padding:5px 0;border-bottom:1px solid var(--line)">
              <span class="mono small">RWY ${esc(c.rwy)} <span class="muted tiny">${esc(c.circuit)}</span></span>
              <span class="mono tiny" style="text-align:right">
                <span style="color:${c.tail ? "var(--bad-ink)" : "var(--ok-ink)"}">${c.tail ? "tail" : "head"} ${Math.abs(c.head).toFixed(1)}</span> ·
                <span style="color:${c.cross > a.maxCross ? "var(--bad-ink)" : c.cross > a.maxCross * 0.7 ? "var(--warn-ink)" : "var(--tx2)"}">xw ${c.cross.toFixed(1)} from ${c.fromLeft ? "L" : "R"}</span>
                ${g && g.cross > c.cross + 0.5 ? `<br><span style="color:${g.cross > a.maxCross ? "var(--bad-ink)" : "var(--warn-ink)"}">in gusts ${g.cross.toFixed(1)} kt</span>` : ""}
              </span>
            </div>`;
          }).join("")}
          ${a.best ? `<div class="tiny mt2" style="color:var(--ok-ink)">Favours runway ${esc(a.best.rwy)} · ${esc(a.best.circuit)} circuit</div>` : ""}
        </div>
      </div>
    </div>
    ${a.flags.length ? `<div class="stack mt3" style="gap:6px">
      ${a.flags.map(f => `<div class="note ${f.sev === "bad" ? "bad" : "warn"} tiny">${esc(f.t)}</div>`).join("")}
    </div>` : `<div class="note ok mt3 tiny">Within the limits you've set. Still your and your instructor's call.</div>`}
    ${upcomingPicker(e)}

}
function miniStat(l, v) {
  return `<div class="panel" style="padding:9px 11px">
    <div class="xtiny muted" style="text-transform:uppercase;letter-spacing:1px">${esc(l)}</div>
    <div class="mono mt2" style="font-size:14px;font-weight:700">${esc(v)}</div>
  </div>`;
}
function upcomingPicker(current) {
  const list = state.entries
    .filter(e => e.kind === "flight" && e.date >= todayKey() && ["confirmed","tentative"].includes(e.status))
    .sort((a,b) => (a.date + (a.start||"")) < (b.date + (b.start||"")) ? -1 : 1).slice(0, 6);
  if (list.length < 2) return "";
  return `<div class="filters mt3">${list.map(e =>
    `<button class="fbtn ${e.id === current.id ? "on" : ""}" onclick="openPlanFor('${escJs(e.id)}')">${esc(fmtDateShort(e.date))}${e.start ? " " + esc(e.start) : ""}</button>`
  ).join("")}</div>`;
}

function sevenDayRows() {
  const rows = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(new Date(), i), key = dkey(d);
    const w = wxAt(key, "12:00");
    if (!w) continue;
    const a = assess(w, false);
    const blocked = baseClosedOn(key) || (awayOn(key) ? "away" : null);
    const colour = a.verdict === "go" ? "var(--ok-ink)" : a.verdict === "marginal" ? "var(--warn-ink)" : "var(--bad-ink)";
    rows.push(`<button class="panel row-b" style="width:100%;text-align:left;gap:10px;opacity:${blocked ? ".5" : "1"}" onclick="onDayTap('${key}')">
      <span style="min-width:64px">
        <span class="small" style="font-weight:700">${DOW[d.getDay()]}</span>
        <span class="tiny muted"> ${d.getDate()} ${MON[d.getMonth()]}</span>
      </span>
      <span class="mono tiny muted" style="flex:1">${Math.round(w.windKt)}kt ${pad3(trueToMag(w.windDir))}°${w.gustKt > w.windKt + 2 ? " G" + Math.round(w.gustKt) : ""}${a.best ? " · " + a.best.rwy : ""}</span>
      <span class="chip" style="color:${colour};border-color:${colour}55">${blocked ? esc(String(blocked)) : a.verdict === "go" ? "Go" : a.verdict === "marginal" ? "Marginal" : "No"}</span>
    </button>`);
  }
  return rows.join("") || `<div class="small muted">No forecast rows available.</div>`;
}

function fuelCard(target) {
  const F = state.settings.fuel;
  const tank = state.ui.fuelTank != null ? state.ui.fuelTank : 40;
  const start = target && target.start ? target.start : "";
  const f = fuelCalc(tank, start);
  return `
  <div class="card mb3">
    <div class="eyebrow mb3">Fuel &amp; endurance</div>
    <div class="g2 mb3">
      <div><label class="label">Tank reading (L)</label>
        <input type="number" inputmode="decimal" step="1" min="0" value="${escAttr(tank)}" oninput="setFuelTank(this.value)"></div>
      <div><label class="label">Off blocks</label>
        <input type="time" value="${escAttr(start)}" oninput="setFuelStart(this.value)"></div>

    <div class="g3 mb3">
      ${miniStat("Usable", f.usable.toFixed(1) + " L")}

/* ── Theme ────────────────────────────────────────────────────────────
   Three states: follow the OS, force light, force dark. Kept in
   localStorage rather than the logbook document so it applies before
   sign-in and never waits on the network. */
const THEMES = ["auto", "light", "dark"];
function currentTheme() {
  const v = localStorage.getItem("flightlog.theme");
  return THEMES.includes(v) ? v : "auto";
}
function themeLabel() {
  const t = currentTheme();
  return t === "auto" ? "following your device" : t;
}
function themeIcon() {
  const t = currentTheme();
  return t === "light" ? "☀" : t === "dark" ? "☾" : "◐";
}
function applyTheme() {
  const t = currentTheme();
  const root = document.documentElement;
  if (t === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", t);
  /* Keep the iOS status bar in step with the surface behind it. */
  const dark = t === "dark" ||
    (t === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0a1626" : "#eef6ff");
}
function cycleTheme() {
  const next = THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length];
  localStorage.setItem("flightlog.theme", next);
  applyTheme();
  render();
  toast("Theme: " + themeLabel());
}

function setTab(t) { state.ui.tab = t; render(); if (t === "plan") fetchWeather(false); }
function setFilter(f) { state.ui.filter = f; render(); }
function setFilterTab(f) { state.ui.tab = "schedule"; state.ui.filter = f; render(); }
function toggleSort() { state.ui.sortAsc = !state.ui.sortAsc; render(); }
function toggleCalMode() { state.ui.calMode = state.ui.calMode === "strip" ? "month" : "strip"; state.ui.monthOffset = 0; render(); }
function shiftMonth(n) { state.ui.monthOffset += n; render(); }
function toggleAddMenu() {
  const m = document.getElementById("add-menu");
  if (m) m.classList.toggle("hide");
}
function openPlanFor(id) { state.ui.planEntry = id; state.ui.tab = "plan"; render(); fetchWeather(false); }
function setFuelTank(v) { state.ui.fuelTank = v; refreshFuel(); }
function setFuelStart(v) { state.ui.fuelStart = v; refreshFuel(); }
function refreshFuel() {
  /* Re-render, then put the caret back — otherwise typing in the tank box
     loses focus after the first keystroke. */
  render();
  const inp = document.querySelector('input[oninput^="setFuelTank"]');
  if (inp) { inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (_) {} }
}

async function cycleStatus(id) {
  const e = state.entries.find(x => x.id === id);
  if (!e || isBlocking(e)) return;
  const i = STATUS_CYCLE.indexOf(e.status);
  e.status = STATUS_CYCLE[(i + 1) % STATUS_CYCLE.length];
  e.updatedAt = nowISO();
  /* Completing a flight without a record is the commonest gap — open the
     record straight away rather than leaving a hole in the logbook. */
  if (e.status === "completed" && e.kind === "flight" && !e.rec) {
    e.rec = newRecord();
    e.rec.depAd = e.rec.arrAd = state.settings.base.name;
    if (e.start) e.rec.offBlocks = e.start;
    await save();
    render();
    openEntry(e.id);
    toast("Add the off/on blocks to log this flight");
    return;
  }
  await save();
  render();
}

async function deleteEntry(id) {
  const e = state.entries.find(x => x.id === id);
  if (!e) return;
  /* The app can't reach into your calendar to withdraw an event it exported
     as a file — say so rather than let you assume it's gone from both. */
  const warn = (e.icsSeq || 0) > 0
    ? "\n\nYou added this to your calendar. Delete it there too — the app can't remove it for you."
    : "";
  if (!confirm("Delete this entry?" + warn)) return;
  state.entries = state.entries.filter(x => x.id !== id);
  await save({ now: true });
  closeSheet();
  render();
  toast("Deleted");
}

function onDayTap(dateStr) {
  const ds = entriesOnDate(dateStr);
  if (ds.length === 1) return openEntry(ds[0].id);
  if (ds.length > 1) {
    return openSheet(`
      <div class="sheet-panel">
        <div class="sheet-head">
          <button class="btn ghost sm" onclick="closeSheet()">Close</button>
          <h2>${esc(fmtDateShort(dateStr))}</h2>
          <button class="btn primary sm" onclick="closeSheet();openEntry(null,'flight','${escJs(dateStr)}')">+ Add</button>
        </div>
        <div class="sheet-body slist">${ds.map(entryCard).join("")}</div>
      </div>`);
  }
  openEntry(null, "flight", dateStr);
}

/* Called straight from the 📅 button. Nothing may be awaited before the
   window.open / share call or the browser treats it as an unrequested popup. */
function calendarAction(id) {
  const e = typeof id === "string" ? state.entries.find(x => x.id === id) : id;
  if (!e) return;
  if (!e.date) { toast("Set a date first", "bad"); return; }
  const provider = state.settings.calendar.provider || "outlook";
  if (provider === "ics") {
    const p = icsExport(e);
    if (p && p.then) p.then(() => render());
    return p;
  }
  openCalendarLink(e, provider);
  setTimeout(render, 300);
}

/* "Add it a different way" — offered from the lesson form, so a route that
   doesn't suit your phone is never a dead end. */
function openCalendarChooser(id) {
  const e = typeof id === "string" ? state.entries.find(x => x.id === id) : id;
  if (!e || !e.date) { toast("Set a date first", "bad"); return; }
  window.__calTarget = e;
  openSheet2(`
    <div class="sheet-panel">
      <div class="sheet-head">
        <button class="btn ghost sm" onclick="closeSheet2()">Close</button>
        <h2>Add to calendar</h2><span style="width:56px"></span>
      </div>
      <div class="sheet-body stack">
        ${CAL_PROVIDERS.map(p => `
          <button class="opt" style="align-items:flex-start" onclick="chooseCalendarRoute('${p.id}')">
            <span class="rc" style="margin-top:2px"><i></i></span>
            <span style="flex:1;min-width:0">
              <span style="display:block;font-weight:700">${esc(p.label)}</span>
              <span class="tiny muted">${esc(p.hint)}</span>
            </span>
          </button>`).join("")}
        <div class="note info tiny">Whichever you pick becomes the default for the 📅 button. Only the .ics route can update an event you've already added — the others create a new one each time.</div>
      </div>
    </div>`);
}
function chooseCalendarRoute(provider) {
  const e = window.__calTarget;
  state.settings.calendar.provider = provider;
  closeSheet2();
  if (!e) return;
  if (provider === "ics") { const p = icsExport(e); if (p && p.then) p.then(() => render()); return; }
  openCalendarLink(e, provider);
  setTimeout(render, 300);
}

/* ═══ 8c. ENTRY FORM ═════════════════════════════════════════════════════ */

let form = { id: null, kind: "flight", data: null };

function openEntry(id, kind, prefillDate) {
  closeSheet2();
  const m = document.getElementById("add-menu"); if (m) m.classList.add("hide");
  if (id) {
    const e = state.entries.find(x => x.id === id);
    if (!e) return;
    form = { id, kind: e.kind, data: JSON.parse(JSON.stringify(e)) };
  } else {
    const e = newEntry(kind || "flight", prefillDate || todayKey());
    if (e.kind === "flight" || e.kind === "ground" || e.kind === "exam") {
      e.start = "10:00";
      e.end = addMins("10:00", state.settings.defaultSlotMins);
    }
    if (e.kind === "flight") {
      const ac = state.settings.aircraft[0];
      if (ac) { e.aircraftReg = ac.reg || ""; e.aircraftType = ac.type || ""; }
    }
    if (isBlocking(e)) e.status = "confirmed";
    form = { id: null, kind: e.kind, data: e };
  }
  renderForm();
}

function renderForm() {
  const f = form.data, k = KINDS[f.kind];
  openSheet(`
    <div class="sheet-panel">
      <div class="sheet-head">
        <button class="btn ghost sm" onclick="closeSheet()">Cancel</button>
        <h2>${k.icon} ${form.id ? "Edit" : "New"} ${esc(k.label.toLowerCase())}</h2>
        <button class="btn primary sm" onclick="saveEntry()">Save</button>
      </div>
      <div class="sheet-body">${formBody()}</div>
    </div>`);
  /* Swallow the tap that opened the sheet so it can't land on a date field. */
  const b = document.querySelector("#sheet .sheet-body");
  if (b) { b.style.pointerEvents = "none"; setTimeout(() => { b.style.pointerEvents = ""; }, 320); }
}

function formBody() {
  const f = form.data;
  if (f.kind === "away")    return awayForm(f);
  if (f.kind === "closure") return blockForm(f, "Reason", "e.g. Christmas Day, maintenance", "This day shows as closed on the calendar.");
  if (f.kind === "weather") return blockForm(f, "Notes", "e.g. 25 kt southwesterly forecast", "A reminder not to book — it doesn't cancel anything by itself.");
  return lessonForm(f);
}

function blockForm(f, label, ph, note) {
  return `
    <div class="field"><label class="label">Date</label>
      <input type="date" id="i-date" value="${escAttr(f.date)}"></div>
    <div class="field"><label class="label">${esc(label)}</label>
      <input id="i-notes" value="${escAttr(f.notes)}" placeholder="${escAttr(ph)}"></div>
    <div class="note info">${esc(note)}</div>
    ${deleteBtn()}`;
}
function awayForm(f) {
  return `
    <div class="g2 field">
      <div><label class="label">From</label><input type="date" id="i-date" value="${escAttr(f.date)}"></div>
      <div><label class="label">To</label><input type="date" id="i-dateEnd" value="${escAttr(f.dateEnd)}"></div>
    </div>
    <div class="field"><label class="label">Reason</label>
      <input id="i-notes" value="${escAttr(f.notes)}" placeholder="e.g. Holiday in Spain"></div>
    <div class="note info">Leave "To" blank for a single day. You'll be warned if you try to book a lesson inside this range.</div>
    ${deleteBtn()}`;
}

function lessonForm(f) {
  const isFlight = f.kind === "flight", isExam = f.kind === "exam";
  const away = f.date ? awayOn(f.date, form.id) : null;
  const closed = f.date ? baseClosedOn(f.date) : null;
  const w = f.date && f.start ? wxAt(f.date, f.start) : null;

/* Form field plumbing — read the DOM into form.data before any re-render, so
   nothing typed is lost when a toggle rebuilds the sheet. */
function readFormDom() {
  const f = form.data, g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const set = (k, id) => { const v = g(id); if (v !== undefined) f[k] = v; };
  set("date", "i-date"); set("dateEnd", "i-dateEnd"); set("notes", "i-notes");
  if (!isBlocking(f)) {
    set("start", "i-start"); set("end", "i-end"); set("status", "i-status");
    set("examId", "i-exam");
    const reg = g("i-reg"); if (reg !== undefined) f.aircraftReg = reg.toUpperCase();
    set("aircraftType", "i-type");
  }
  if (document.getElementById("i-off") || document.getElementById("i-total")) {
    if (!f.rec) f.rec = newRecord();
    const r = f.rec, rg = (k, id) => { const v = g(id); if (v !== undefined) r[k] = v; };
    rg("depAd","i-dep"); rg("arrAd","i-arr"); rg("offBlocks","i-off"); rg("onBlocks","i-on");
    rg("totalTime","i-total"); rg("dualTime","i-dual"); rg("p1Time","i-p1");
    rg("landings","i-ldg"); rg("xcDistanceNm","i-xcnm"); rg("remarks","i-remarks");
  }
}
function setField(k, v) { readFormDom(); form.data[k] = v; renderForm(); }
function toggleRec(k) { readFormDom(); if (!form.data.rec) form.data.rec = newRecord(); form.data.rec[k] = !form.data.rec[k]; if (k === "xc" && !form.data.rec.xc) form.data.rec.qualifyingXC = false; renderForm(); }
function toggleExercise(id) {
  readFormDom();
  const f = form.data;
  f.exercises = f.exercises || [];
  const i = f.exercises.indexOf(id);
  if (i === -1) f.exercises.push(id); else f.exercises.splice(i, 1);
  f.exercises.sort((a,b) => EXERCISES.findIndex(x=>x.id===a) - EXERCISES.findIndex(x=>x.id===b));
  renderForm();
}
function onFormDate(v) { readFormDom(); form.data.date = v; renderForm(); }
function onFormStatus(v) {
  readFormDom(); form.data.status = v;
  if (v === "completed" && form.data.kind === "flight" && !form.data.rec) {
    form.data.rec = newRecord();
    form.data.rec.depAd = form.data.rec.arrAd = state.settings.base.name;
    if (form.data.start) form.data.rec.offBlocks = form.data.start;
  }
  renderForm();
}
function onFormStart(v) {
  readFormDom();
  form.data.start = v;
  if (v) form.data.end = addMins(v, state.settings.defaultSlotMins);
  renderForm();
}
function onBlocksChange() {
  readFormDom();
  const r = form.data.rec;
  const d = durMins(r.offBlocks, r.onBlocks);
  /* Auto-fill total and the dual/P1 column so the common case is zero typing. */
  if (d != null && d > 0) {
    r.totalTime = (d / 60).toFixed(2);
    const solo = (form.data.exercises || []).some(id => { const x = EXERCISES.find(z => z.id === id); return x && /^17[ab]|^18[cd]/.test(x.ref); });
    if (solo) { r.p1Time = r.totalTime; r.dualTime = ""; }
    else      { r.dualTime = r.totalTime; r.p1Time = ""; }
    if (!r.landings) r.landings = "1";
  }
  renderForm();
}
function addRecordNow() {
  readFormDom();
  form.data.rec = newRecord();
  form.data.rec.depAd = form.data.rec.arrAd = state.settings.base.name;
  if (form.data.start) form.data.rec.offBlocks = form.data.start;
  renderForm();
}
function promptInstructor() {
  readFormDom();
  const n = prompt("Instructor name:", form.data.instructor || "");
  if (n != null) form.data.instructor = n.trim();
  renderForm();
}

async function saveEntry() {
  readFormDom();
  const f = form.data;
  if (!f.date) { toast("Set a date", "bad"); return; }
  if (!isBlocking(f) && !f.start) { toast("Set a start time", "bad"); return; }
  if (!isBlocking(f) && f.end && f.start && durMins(f.start, f.end) === 0) f.end = addMins(f.start, state.settings.defaultSlotMins);

  const away = awayOn(f.date, form.id);
  if (!isBlocking(f) && away && !confirm("You're marked away on " + fmtDateShort(f.date) + ". Book it anyway?")) return;

  f.updatedAt = nowISO();
  if (f.rec && recTotalMins(f.rec) === 0 && !f.rec.offBlocks && !f.rec.remarks) f.rec = null;

  if (form.id) state.entries = state.entries.map(x => x.id === form.id ? f : x);
  else state.entries.push(f);

  await save({ now: true });
  closeSheet();
  render();

  /* If it's already in the calendar and the time or date moved, the calendar
     is now wrong and only you can fix it. Say so plainly. */
  const moved = (f.icsSeq || 0) > 0;
  toast(moved ? "Saved — tap 📅 to update your calendar" : "Saved", "ok");
}

/* Add-to-calendar from inside the form: pick up whatever is on screen first,
   then hand off. readFormDom() is synchronous, so the tap's user activation
   survives and Safari allows the share sheet. */
function calendarFromForm(chooser) {
  readFormDom();
  const f = form.data;
  if (!f.date) { toast("Set a date first", "bad"); return; }
  if (!isBlocking(f) && !f.start) { toast("Set a start time first", "bad"); return; }
  /* Persist it too, so the entry and its calendar event can't drift apart
     just because the form was never saved. */
  if (!form.id) { state.entries.push(f); form.id = f.id; }
  else state.entries = state.entries.map(x => x.id === form.id ? f : x);
  if (chooser) return openCalendarChooser(f);
  const p = calendarAction(f);
  if (p && p.then) p.then(() => { renderForm(); render(); });
  else setTimeout(() => { renderForm(); render(); }, 300);
  return p;
}

async function saveSettings() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const n = (id, d) => { const v = parseFloat(g(id)); return isNaN(v) ? d : v; };
  const s = state.settings;

  s.calendar.reminderMins = n("s-remind", s.calendar.reminderMins);

  s.targets = { totalHours:n("s-t-total",25), soloHours:n("s-t-solo",10), soloXCHours:n("s-t-soloxc",5), qualifyingXCNm:n("s-t-qxc",100) };
  s.limits = Object.assign(s.limits, {
    dualWindKt:n("s-l-dw",20), dualXwindKt:n("s-l-dx",12),
    soloWindKt:n("s-l-sw",12), soloXwindKt:n("s-l-sx",7),
    minVisM:n("s-l-vis",5000), minCloudFt:n("s-l-cld",1500)
  });
  s.fuel = Object.assign(s.fuel, { burnLph:n("s-f-burn",12.5), reserveL:n("s-f-res",12.5), tankCapacityL:n("s-f-cap",65) });
  if (g("s-b-name") !== undefined) s.base.name = g("s-b-name");
  s.base.lat = n("s-b-lat", s.base.lat); s.base.lon = n("s-b-lon", s.base.lon);
  if (g("s-b-metar") !== undefined) s.base.metarStation = (g("s-b-metar") || "").toUpperCase();
  s.base.magVarDeg = n("s-b-var", s.base.magVarDeg);
  if (g("s-b-cs") !== undefined) s.base.callsignPrefix = g("s-b-cs");
  s.defaultSlotMins = n("s-slot", 90);
  if (g("s-inst") !== undefined) s.instructors = g("s-inst").split("\n").map(x => x.trim()).filter(Boolean);

  await save({ now: true });
  state.wx.fetchedAt = null;                 // base/limits may have moved
  closeSheet(); render(); toast("Settings saved", "ok");
}

function setCalProvider(id) {
  /* Read the rest of the settings sheet first so the reminder box isn't lost
     when the panel re-renders. */
  const el = document.getElementById("s-remind");
  if (el) state.settings.calendar.reminderMins = parseFloat(el.value) || state.settings.calendar.reminderMins;
  state.settings.calendar.provider = id;
  save({ silent: true });
  openSettings();
}

function exportJSON() {
  downloadFile("flightlog-backup-" + todayKey() + ".json",
    JSON.stringify({ v:2, appVersion:APP_VERSION, exportedAt:nowISO(), entries:state.entries, settings:state.settings }, null, 2),
    "application/json");
}

/* ═══ 8e. PRINTABLE SOLO KNEEBOARD CARD ══════════════════════════════════ */

function printKneeboard() {
  const s = state.settings;
  const target = (state.ui.planEntry && state.entries.find(e => e.id === state.ui.planEntry))
    || state.entries.filter(e => e.kind === "flight" && e.date >= todayKey())
                    .sort((a, b) => a.date < b.date ? -1 : 1)[0]
    || null;
  const card = kneeboardHtml(target);
  /* Two copies side by side, exactly like the card you're using now. */
  document.getElementById("printcard").innerHTML = `<div class="kb">${card}${card}</div>`;
  setTimeout(() => window.print(), 60);
}

function kneeboardHtml(e) {
  const s = state.settings, b = s.base;
  const rows = fuelTableRows();
  const rwy = b.runways;
  const blank = '<span style="display:inline-block;border-bottom:1px solid #666;min-width:26mm">&nbsp;</span>';
  return `
  <div class="card2">
    <table>
      <tr><td class="hd" colspan="2"></td></tr>
      <tr>
        <td style="width:50%"><span class="lbl">Date</span><span class="val">${e ? esc(fmtDateShort(e.date)) : "&nbsp;"}</span></td>
        <td><span class="lbl">Aircraft</span><span class="val">${e && e.aircraftReg ? esc(e.aircraftReg) : "G-"}</span></td>
      </tr>
      <tr>
        <td class="blue">
          <span class="lbl">Runway</span>
          <span class="val">${rwy.map(r => r.id + " ☐").join("&nbsp;&nbsp;&nbsp;")}</span>
          <div style="font-size:7pt">${rwy.map(r => r.circuit === "RH" ? "RHC" : "LHC").join("&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;")}</div>
        </td>
        <td class="blue"><span class="lbl">QNH</span><span class="val">&nbsp;</span>
          <div style="font-size:6.5pt;margin-top:2mm">Squawk — no transponder = negative squawk</div></td>
      </tr>
      <tr><td colspan="2" class="ttl" style="text-align:left;border-bottom:none">FREQUENCIES</td></tr>
      <tr><td colspan="2" style="padding:0">
        <table style="border:none"><tr>
          ${b.frequencies.map(f => `<td style="border-top:none;border-bottom:none"><span class="lbl">${esc(f.name)}</span><span class="val">${esc(f.mhz)}</span></td>`).join("")}
        </tr></table>
      </td></tr>
      <tr>
        <td class="blue"><strong>${esc(b.name)}: ${rwy.map(r=>r.id).join(" / ")}</strong>
          <div style="font-size:7.5pt;margin-top:1.5mm">${rwy.map(r => r.id + " = " + (r.circuit === "RH" ? "Right Hand" : "Left Hand")).join("<br>")}</div></td>
        <td><div class="ttl" style="padding:0 0 1.5mm">SOLO LOCAL LIMITS</div>
          <div style="font-size:7.5pt">Area / radius ${blank}</div>
          <div style="font-size:7.5pt;margin-top:1.5mm">Max altitude ${blank}</div></td>
      </tr>
      <tr><td colspan="2" class="ttl">LOCAL SOLO FLIGHT</td></tr>
      <tr><td colspan="2" style="padding:0">
        <table style="border:none">
          <tr class="pink">
            <th style="border-top:none"><span class="lbl">Operating area / route</span></th>
            <th style="border-top:none"><span class="lbl">Planned altitude</span></th>
            <th style="border-top:none"><span class="lbl">Cloud base</span></th>
            <th style="border-top:none"><span class="lbl">Latest return</span></th>
          </tr>
          <tr class="pink"><td style="height:11mm"></td><td></td><td></td><td></td></tr>
        </table>
      </td></tr>
      <tr>
        <td><span class="lbl">Fuel (L)</span><span class="val">&nbsp;</span></td>
        <td><span class="lbl">Hours (usable ÷ ${esc(s.fuel.burnLph)})</span><span class="val">&nbsp;</span></td>
      </tr>
      <tr><td colspan="2" style="font-style:italic;font-size:7.5pt;border-top:none">
        Reminder: apply the one-hour rule — land with at least 1 hour of fuel in reserve.</td></tr>
      <tr><td colspan="2" class="script" style="border-top:none">
        ${esc(b.name)} Radio, ${esc(b.callsignPrefix)} ${blank}, student solo, on the apron,<br>
        requesting airfield information and radio check.</td></tr>
      <tr><td colspan="2" style="border-top:none">
        <span class="lbl">Notes</span>
        <div style="font-size:8pt;font-weight:700;margin-bottom:1mm">STUDENT ${esc(b.callsignPrefix.toUpperCase())} ${blank}</div>
        ${'<div class="rule"></div>'.repeat(5)}
      </td></tr>
      <tr><td colspan="2" style="padding:0">
        <table class="fuel grey" style="border:none">
          <tr><th style="border-top:none">Tank</th><th style="border-top:none">Usable</th><th style="border-top:none">Time</th><th style="border-top:none">+1 L</th></tr>
          ${rows.map(r => `<tr><td>${r.tank} L</td><td>${r.usable.toFixed(1)} L</td><td>${r.time}</td><td>+ 4 mins</td></tr>`).join("")}
        </table>
      </td></tr>
    </table>
  </div>`;
}

/* ═══ 8f. INIT ═══════════════════════════════════════════════════════════ */

function showBootError(err) {
  const msg = (err && (err.stack || err.message)) || String(err);
  const app = document.getElementById("app");
  if (!app) return;
  app.innerHTML = `<div class="shell">
    <div class="note bad"><strong>The app failed to start.</strong>
      <pre class="mono tiny mt2" style="white-space:pre-wrap">${esc(msg)}</pre>
      <p class="tiny mt3">Your data is safe in the cloud and in this device's storage. If you just edited the file, open it in Safari once before re-adding it to the Home Screen.</p>
    </div></div>`;
}
window.addEventListener("error", e => { console.error(e); if (!document.querySelector(".tabbar")) showBootError(e.error || e.message); });
window.addEventListener("unhandledrejection", e => console.warn("Unhandled rejection:", e.reason));

/* Close sheets by tapping the backdrop (desktop/iPad modal presentation). */
["sheet","sheet2"].forEach(id => {
  document.getElementById(id).addEventListener("click", function (ev) {
    if (ev.target === this) this.classList.remove("open");
  });
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const s2 = document.getElementById("sheet2"), s1 = document.getElementById("sheet");
  if (s2.classList.contains("open")) s2.classList.remove("open");
  else if (s1.classList.contains("open")) s1.classList.remove("open");
});

window.addEventListener("online",  () => { toast("Back online — syncing"); save({ silent:true }); });
window.addEventListener("offline", () => toast("Offline — changes are kept on this device"));

/* Web app manifest, generated in-page so there's no second file to deploy.
   Only Chrome/Android reads this; iOS uses the apple-mobile-web-app-* meta
   tags in the head. */
applyTheme();
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onChange = () => { if (currentTheme() === "auto") applyTheme(); };
  if (mq.addEventListener) mq.addEventListener("change", onChange);
  else if (mq.addListener) mq.addListener(onChange);
}

(function injectManifest() {
  try {
    const icon = "data:image/svg+xml," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>" +
      "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
      "<stop offset='0' stop-color='#0ea5e9'/><stop offset='1' stop-color='#2563eb'/></linearGradient></defs>" +
      "<rect width='512' height='512' rx='112' fill='url(#g)'/>" +
      "<text x='256' y='352' font-size='280' text-anchor='middle' fill='#ffffff'>✈</text></svg>");
    const manifest = {
      name: "Flight Log — NPPL(M)", short_name: "Flight Log",
      start_url: location.pathname, scope: location.pathname.replace(/[^/]*$/, ""),
      display: "standalone", background_color: "#eef6ff", theme_color: "#0ea5e9",
      icons: [{ src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "any" }]
    };
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
    document.head.appendChild(link);
  } catch (_) {}
})();

/* Offline shell. Entirely optional — sw.js is a separate file, and if you
   only deploy index.html this quietly does nothing rather than erroring. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", async () => {
    try {
      const probe = await fetch("sw.js", { method: "HEAD" });
      if (probe.ok) await navigator.serviceWorker.register("sw.js");
    } catch (_) { /* no sw.js deployed — the app works, just not offline */ }
  });
}

(function boot() {
  auth.onAuthStateChanged(async user => {
    if (!user) { state.user = null; renderSignedOut(); return; }
    state.user = user.email || user.uid;
    document.getElementById("app").innerHTML =
      `<div class="shell"><div class="empty"><span class="ic">✈</span>Loading your logbook…</div></div>`;
    try {
      await load();
      render();
      if (state.ui.tab === "plan" || state.entries.some(e => e.date >= todayKey())) fetchWeather(false);
    } catch (e) {
      showBootError(e);
    }
  });
})();
</script>
