<script>
/* ═══════════════════════════════════════════
   DATA & CONSTANTS
   ═══════════════════════════════════════════ */
const STORAGE_KEY = "flight-log-v1";
const LESSON_TYPES = [
  "Ex 1 – Air Experience","Ex 2 – Aircraft Parts, Controls & Systems","Ex 3 – Preparation for Flight & Actions After",
  "Ex 4 – Effects of Controls","Ex 5 – Taxiing",
  "Ex 6 – Straight & Level Flight","Ex 7 – Basic Climbing & Descending","Ex 8 – Performance Climbing & Descending",
  "Ex 9a – Turning Flight","Ex 9b – Compass Turns",
  "Ex 10a – Stalling & Recovery","Ex 10b – Spin Avoidance","Ex 11 – Unusual Attitudes & Recovery",
  "Ex 12 – Take-Off & Climb to Downwind","Ex 13 – Circuit, Approach & Landing",
  "Ex 14 – Advanced Turning","Ex 15 – Crosswind Operations",
  "Ex 16a – Forced Landings","Ex 16b – Operation at Minimum Level",
  "Ex 17a – First Solo","Ex 17b – Solo Consolidation","Ex 17c – Dual Revision for GST",
  "Ex 18a – Dual Navigation","Ex 18b – Dual Nav (Min Level & Lost Proc)",
  "Ex 18c – Solo Nav (1st Qualifying XC)","Ex 18d – Solo Nav (2nd Qualifying XC)",
  "General Skills Test (GST)","Ground Oral Examination",
  "Ground School","Pre-Flight Briefing","Refresher – Return to Flying","Other",
];
const EXAM_TYPES = ["Exam – Aviation Law","Exam – Meteorology","Exam – Navigation","Exam – Human Performance & Limitations","Exam – Aircraft Technical"];
const ALL_TYPES = [...LESSON_TYPES, ...EXAM_TYPES];
const INSTRUCTORS = ["Paul Haskins", "Mark Peters", "Paul Bennet"];
const STATUSES = [
  { v: "confirmed", l: "Confirmed", c: "#22c55e", bg: "#052e16" },
  { v: "tentative", l: "Tentative", c: "#eab308", bg: "#422006" },
  { v: "cancelled", l: "Cancelled", c: "#ef4444", bg: "#450a0a" },
  { v: "completed", l: "Completed", c: "#3b82f6", bg: "#0c1929" },
  { v: "closed", l: "Closed", c: "#f87171", bg: "#3b0a0a" },
  { v: "away", l: "Away", c: "#a78bfa", bg: "#1e1145" },
  { v: "weather", l: "Poor Weather", c: "#94a3b8", bg: "#1a1c22" },
];
const BOOKING_STATUSES = STATUSES.filter(s => s.v !== "closed" && s.v !== "away" && s.v !== "weather");
const STATUS_ORDER = ["tentative","confirmed","completed","cancelled"];
const DN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let state = { sessions: [], filter: "all", sortAsc: true };

/* Defaults & empty templates (prevent ReferenceErrors on first run) */
const EMPTY_SESSION = {
  id: null,
  date: "",
  time: "12:00",
  lessonType: "Ex 1 – Air Experience",
  status: "tentative",
  instructor: "",
  customInstructor: "",
  aircraft: "",
  durationHrs: 1.5,
  hobbsLogged: "",
  notes: "",
};

const EMPTY_CLOSURE = {
  id: null,
  date: "",
  time: "00:00",
  lessonType: "Airfield Closed",
  status: "closed",
  notes: "",
};

const EMPTY_AWAY = {
  id: null,
  date: "",
  dateEnd: "",
  time: "00:00",
  lessonType: "Away / Holiday",
  status: "away",
  notes: "",
};

const EMPTY_WEATHER = {
  id: null,
  date: "",
  time: "00:00",
  lessonType: "Poor Weather",
  status: "weather",
  notes: "",
};

/* Keep this empty by default. Add sample sessions here if you want. */
const DEFAULT_SESSIONS = [];



/* ═══════════════════════════════════════════
   STORAGE
   ═══════════════════════════════════════════ */
/* ═══════════════════════════════════════════
   STORAGE (Firebase Cloud Sync)
   ═══════════════════════════════════════════ */
// 1. PASTE YOUR FIREBASE CONFIG HERE:
const firebaseConfig = {
   apiKey: "AIzaSyAyH18OH7R8PN53teOE2XLsgOLG68ulaGc",
  authDomain: "flight-log-3ffc0.firebaseapp.com",
  projectId: "flight-log-3ffc0",
  storageBucket: "flight-log-3ffc0.firebasestorage.app",
  messagingSenderId: "92995886107",
  appId: "1:92995886107:web:399964c02417b786516cbe"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

// Sign in and Sign out functions
function signIn() {
  auth.signInWithPopup(provider).catch(err => alert("Login failed: " + err.message));
}
function signOut() {
  auth.signOut();
}

async function load() {
  try {
    const docSnap = await db.collection("flightlog").doc("mysessions").get();
    if (docSnap.exists) {
      const data = docSnap.data();
      if (data.sessions) state.sessions = data.sessions;
    }
  } catch(e) {
    console.error("Cloud load failed, checking local backup:", e);
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d.sessions) state.sessions = d.sessions; }
  }
}

async function save() {
  try {
    // Save locally as a backup just in case
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ sessions: state.sessions, savedAt: new Date().toISOString() }));
    
    // Push to the cloud
    await db.collection("flightlog").doc("mysessions").set({
      sessions: state.sessions,
      lastUpdated: new Date().toISOString()
    });
    showSaved();
  } catch(e) { 
    console.error("Cloud save failed:", e); 
    alert("Saved locally, but failed to sync to the cloud. Check your connection.");
  }
}

function showSaved() {
  const el = document.getElementById("save-indicator");
  if (!el) return;
  el.textContent = "● Cloud Synced"; el.style.color = "#3b82f6"; // Changed to blue to indicate cloud
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent = ""; }, 2000);
}

/* ═══════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════ */
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(d) { if (!d) return ""; const dt = new Date(d+"T00:00:00"); return dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); }
function fmtTime(t) { if (!t||t==="00:00") return ""; const [h,m]=t.split(":"); const hr=parseInt(h); return `${hr%12||12}:${m} ${hr>=12?"PM":"AM"}`; }
function dateKey(d) { return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isSameDay(a,b) { return dateKey(a)===dateKey(b); }
function isWeekendClosed(d) { const day = typeof d==="string" ? new Date(d+"T00:00:00").getDay() : d.getDay(); return day===0||day===1; }
function esc(s) { const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function getStatus(v) { return STATUSES.find(s=>s.v===v)||STATUSES[0]; }
function badge(status, small) {
  const s = getStatus(status);
  return `<span class="badge" style="color:${s.c};background:${s.bg};border:1px solid ${s.c}30;${small?'font-size:9px;padding:2px 7px':'font-size:10px;padding:3px 10px'}"><span class="dot" style="background:${s.c}"></span>${s.l}</span>`;
}
function getInstructor(s) { return s.instructor==="__custom__" ? s.customInstructor : s.instructor; }
function hoursUsed() { return state.sessions.filter(s=>s.status!=="cancelled"&&s.status!=="closed"&&s.hobbsLogged).reduce((sum,s)=>sum+(parseFloat(s.hobbsLogged)||0),0); }

function stormSVG(size) {
  size = size || 28;
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 58" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle">
    <path d="M48.5 24.5C48.2 16.3 41.5 10 33.5 10c-6.2 0-11.6 3.8-13.8 9.3C13.3 20 8 25.7 8 32.5 8 40 14 46 21.5 46H46c5.5 0 10-4.5 10-10 0-5-3.7-9.2-8.5-10.2z" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <path d="M34 34l-6 10h8l-6 10" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function getAwayForDate(dateStr) {
  return state.sessions.find(s => {
    if (s.status !== "away") return false;
    if (s.dateEnd && s.dateEnd >= s.date) return dateStr >= s.date && dateStr <= s.dateEnd;
    return s.date === dateStr;
  }) || null;
}
function isDateAway(dateStr, excludeId) {
  return state.sessions.some(s => {
    if (s.status !== "away") return false;
    if (excludeId && s.id === excludeId) return false;
    if (s.dateEnd && s.dateEnd >= s.date) return dateStr >= s.date && dateStr <= s.dateEnd;
    return s.date === dateStr;
  });
}

/* ═══════════════════════════════════════════
   ADD TO CALENDAR (.ics generation)
   ═══════════════════════════════════════════ */
function padTwo(n) { return n.toString().padStart(2, "0"); }

function toICSDate(dateStr, timeStr) {
  // Returns YYYYMMDDTHHMMSS format (local time, no Z suffix)
  const [y, m, d] = dateStr.split("-");
  const [hh, mm] = (timeStr || "00:00").split(":");
  return `${y}${padTwo(m)}${padTwo(d)}T${padTwo(hh)}${padTwo(mm)}00`;
}

function icsEscape(str) {
  if (!str) return "";
  return str.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}

function foldLine(line) {
  // ICS spec: lines should be max 75 octets; fold with CRLF + space
  const parts = [];
  while (line.length > 75) {
    parts.push(line.substring(0, 75));
    line = " " + line.substring(75);
  }
  parts.push(line);
  return parts.join("\r\n");
}

function generateICS(session) {
  const isExam = session.lessonType && session.lessonType.startsWith("Exam");
  const inst = getInstructor(session);
  const durationHrs = parseFloat(session.durationHrs) || 1.5;
  const durationMins = Math.round(durationHrs * 60);

  // Calculate end time
  const startDate = new Date(session.date + "T" + (session.time || "09:00") + ":00");
  const endDate = new Date(startDate.getTime() + durationMins * 60 * 1000);

  const dtStart = toICSDate(session.date, session.time || "09:00");
  const endDateStr = endDate.getFullYear() + "-" + padTwo(endDate.getMonth()+1) + "-" + padTwo(endDate.getDate());
  const endTimeStr = padTwo(endDate.getHours()) + ":" + padTwo(endDate.getMinutes());
  const dtEnd = toICSDate(endDateStr, endTimeStr);

  // Build summary
  const statusLabel = getStatus(session.status).l;
  let summary = isExam ? `📝 ${session.lessonType}` : `✈ ${session.lessonType}`;

  // Build description (clean + calendar-friendly)
  // Many calendar apps use proportional fonts and collapse/warp box drawing characters,
  // so keep this plain, readable, and scannable.
  const statusEmoji =
    session.status === "confirmed" ? "✅" :
    session.status === "tentative" ? "🟡" :
    session.status === "completed" ? "🔵" :
    session.status === "cancelled" ? "❌" : "";

  const descLines = [];
  descLines.push("NPPL (Microlight) Training");
  descLines.push(isExam ? "Exam session" : "Flight session");
  descLines.push("");
  descLines.push(`Session: ${session.lessonType}`);
  if (inst) descLines.push(`Instructor: ${inst}`);
  descLines.push(`Status: ${statusEmoji} ${statusLabel}`);
  if (session.aircraft) descLines.push(`Aircraft: ${session.aircraft}`);

  if (!isExam) {
    const planned = `${durationHrs}h planned`;
    const hobbs = session.hobbsLogged ? `${session.hobbsLogged}h Hobbs logged` : "";
    descLines.push(`Duration: ${planned}${hobbs ? " • " + hobbs : ""}`);
  }

  if (session.notes) {
    descLines.push("");
    descLines.push("Notes:");
    session.notes.split("\n").forEach(l => {
      const line = (l || "").trim();
      if (line) descLines.push(`• ${line}`);
    });
  }

  const description = descLines.join("\n");

  const now = new Date();
  const stamp = now.getFullYear().toString() +
    padTwo(now.getMonth()+1) + padTwo(now.getDate()) + "T" +
    padTwo(now.getHours()) + padTwo(now.getMinutes()) + padTwo(now.getSeconds());

  const uid = (session.id || genId()) + "@flightlog.app";

  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Flight Log//NPPL Training//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    foldLine("UID:" + uid),
    foldLine("DTSTAMP:" + stamp),
    foldLine("DTSTART:" + dtStart),
    foldLine("DTEND:" + dtEnd),
    foldLine("SUMMARY:" + icsEscape(summary)),
    foldLine("DESCRIPTION:" + icsEscape(description)),
  ];

  // Add status mapping
  if (session.status === "confirmed") {
    lines.push("STATUS:CONFIRMED");
  } else if (session.status === "tentative") {
    lines.push("STATUS:TENTATIVE");
  } else if (session.status === "cancelled") {
    lines.push("STATUS:CANCELLED");
  }

  // Add alarm reminder 1 hour before
  if (session.status !== "cancelled" && session.status !== "completed") {
    lines.push("BEGIN:VALARM");
    lines.push("TRIGGER:-PT1H");
    lines.push("ACTION:DISPLAY");
    lines.push(foldLine("DESCRIPTION:Flight training in 1 hour: " + icsEscape(session.lessonType)));
    lines.push("END:VALARM");
  }

  lines.push("END:VEVENT");
  lines.push("END:VCALENDAR");

  return lines.join("\r\n");
}

function addToCalendar(sessionOrId) {
  // Read form values first if we're in the form
  let session;
  if (typeof sessionOrId === "string") {
    session = state.sessions.find(s => s.id === sessionOrId);
  } else {
    session = sessionOrId;
  }

  if (!session || !session.date) {
    alert("Please set a date before adding to calendar.");
    return;
  }
  if (session.status === "closed") return;

  const icsContent = generateICS(session);
  const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });

  // Use different approaches depending on platform
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (isIOS) {
    // On iOS, we need a data URI approach for better calendar picker support
    const reader = new FileReader();
    reader.onload = function() {
      const a = document.createElement("a");
      a.href = reader.result;
      a.download = "flight-session.ics";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => document.body.removeChild(a), 100);
    };
    reader.readAsDataURL(blob);
  } else {
    // Standard download approach
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "flight-session.ics";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  }
}

function addToCalendarFromForm() {
  // Read the current form values into formState.data first
  readForm();
  const f = formState.data;
  if (!f.date) {
    alert("Please set a date first.");
    return;
  }
  if (!f.time && formState.mode !== "closure") {
    alert("Please set a time first.");
    return;
  }
  addToCalendar(f);
}

function render() {
  const today = new Date(); today.setHours(0,0,0,0);

  const upcoming = state.sessions.filter(s=>(s.status==="confirmed"||s.status==="tentative")&&new Date(s.date)>=today).length;
  const completed = state.sessions.filter(s=>s.status==="completed").length;
  const cancelled = state.sessions.filter(s=>s.status==="cancelled").length;

  const filtered = state.sessions
    .filter(s => state.filter==="all" || s.status===state.filter)
    .sort((a,b) => {
      const da=new Date(a.date+"T"+(a.time||"00:00")), db=new Date(b.date+"T"+(b.time||"00:00"));
      return state.sortAsc ? da-db : db-da;
    });

  // Calendar days (scroll ~3 months ahead)
  const days = [];
  const end = new Date(today);
  end.setMonth(end.getMonth() + 3);
  for (let d = new Date(today); d <= end; d.setDate(d.getDate() + 1)) {
    days.push(new Date(d));
  }
  const byDate = {};
  state.sessions.forEach(s => {
    // For away entries with a date range, insert into every day in the range
    if (s.status === "away" && s.dateEnd && s.dateEnd >= s.date) {
      let cur = new Date(s.date + "T00:00:00");
      const last = new Date(s.dateEnd + "T00:00:00");
      while (cur <= last) {
        const k = dateKey(cur);
        if (!byDate[k]) byDate[k] = [];
        byDate[k].push(s);
        cur.setDate(cur.getDate() + 1);
      }
    } else {
      if (!byDate[s.date]) byDate[s.date] = [];
      byDate[s.date].push(s);
    }
  });

  let calHTML = days.map(d => {
    const key = dateKey(d);
    const isToday = isSameDay(d,today);
    const wClosed = isWeekendClosed(d);
    const isSunday = d.getDay()===0;
    const isMonday = d.getDay()===1;
    const ds = byDate[key]||[];
    const hasClosure = ds.some(s=>s.status==="closed");
    const hasAway = ds.some(s=>s.status==="away");
    const hasWeather = ds.some(s=>s.status==="weather");
    const closed = wClosed||hasClosure;
    const lessons = ds.filter(s=>s.status!=="closed"&&s.status!=="away"&&s.status!=="weather");

function toggleNewMenu() {
  const m = document.getElementById("new-menu");
  if (m) m.style.display = m.style.display==="none"?"block":"none";
}
function closeNewMenu() {
  const m = document.getElementById("new-menu");
  if (m) m.style.display = "none";
}
function setFilter(f) { state.filter=f; render(); }
function toggleSort() { state.sortAsc=!state.sortAsc; render(); }

function deleteSession(id) {
  if (!confirm("Are you sure you want to delete this session?")) return;
  state.sessions = state.sessions.filter(s=>s.id!==id);
  save(); render();
}
function toggleStatus(id) {
  state.sessions = state.sessions.map(s => {
    if (s.id!==id||s.status==="closed"||s.status==="away"||s.status==="weather") return s;
    const i = STATUS_ORDER.indexOf(s.status);
    return {...s, status: STATUS_ORDER[(i+1)%STATUS_ORDER.length]};
  });
  save(); render();
}
function resetBlock() {
  if (!confirm("Clear all logged hours and start a fresh 10-hour block?")) return;
  state.sessions = state.sessions.map(s=>({...s, hobbsLogged:""}));
  save(); render();
}

function handleDayClick(dateStr) {
  // Check for away entry covering this date (including ranges)
  const away = getAwayForDate(dateStr);

  // Find direct-date matches (not range-expanded)
  const ds = state.sessions.filter(s => s.date === dateStr);
  const sessions = ds.filter(s=>s.status!=="closed"&&s.status!=="away"&&s.status!=="weather");
  const closures = ds.filter(s=>s.status==="closed");
  const weathers = ds.filter(s=>s.status==="weather");

  // Away day (from range or direct) with nothing else booked → open away for editing
  if (away && sessions.length === 0 && closures.length === 0 && weathers.length === 0) {
    openEdit(away.id);
    return;
  }

  // Weather day with nothing else → open weather for editing
  if (weathers.length === 1 && sessions.length === 0 && closures.length === 0) {
    openEdit(weathers[0].id);
    return;
  }

  if (sessions.length===1&&closures.length===0) openEdit(sessions[0].id);
  else if (closures.length===1&&sessions.length===0) openEdit(closures[0].id);
  else if (ds.length===0) {
    // Empty day but covered by an away range → open the away
    if (away) { openEdit(away.id); return; }
    openNewSession(dateStr);
  }
}

let formState = { mode: "session", editing: null, data: {} };

function buildTypeOptions() {
  const groups = [
    { label: "Phase 1: Familiarisation", test: t => /^Ex [1-5]\b/.test(t) },
    { label: "Phase 2: Basic Manoeuvres", test: t => /^Ex [6-9]/.test(t) },
    { label: "Phase 3: Circuit & Emergencies", test: t => /^Ex 1[0-5]/.test(t) },
    { label: "Phase 4: Solo", test: t => /^Ex 1[6-7]/.test(t) },
    { label: "Phase 5: Navigation", test: t => t.startsWith("Ex 18") },
  ];
  let html = groups.map(g => `<optgroup label="${g.label}">${ALL_TYPES.filter(g.test).map(t=>`<option>${esc(t)}</option>`).join("")}</optgroup>`).join("");
  html += `<optgroup label="Tests"><option>General Skills Test (GST)</option><option>Ground Oral Examination</option></optgroup>`;
  html += `<optgroup label="Ground Exams">${EXAM_TYPES.map(t=>`<option>${esc(t)}</option>`).join("")}</optgroup>`;
  html += `<optgroup label="Other"><option>Ground School</option><option>Pre-Flight Briefing</option><option>Refresher – Return to Flying</option><option>Other</option></optgroup>`;
  return html;
}

function openNewSession(prefillDate) {
  formState = { mode: "session", editing: null, data: { ...JSON.parse(JSON.stringify(EMPTY_SESSION)), date: prefillDate||"" } };
  formState.data.id = null;
  closeNewMenu();
  renderForm();
}
function openNewClosure(prefillDate) {
  formState = { mode: "closure", editing: null, data: { ...JSON.parse(JSON.stringify(EMPTY_CLOSURE)), date: prefillDate||"" } };
  formState.data.id = null;
  closeNewMenu();
  renderForm();
}
function openNewAway(prefillDate) {
  formState = { mode: "away", editing: null, data: { ...JSON.parse(JSON.stringify(EMPTY_AWAY)), date: prefillDate||"" } };
  formState.data.id = null;
  closeNewMenu();
  renderForm();
}
function openNewWeather(prefillDate) {
  formState = { mode: "weather", editing: null, data: { ...JSON.parse(JSON.stringify(EMPTY_WEATHER)), date: prefillDate||"" } };
  formState.data.id = null;
  closeNewMenu();
  renderForm();
}
function openEdit(id) {
  const s = state.sessions.find(x=>x.id===id);
  if (!s) return;
  const mode = s.status==="closed"?"closure":s.status==="away"?"away":s.status==="weather"?"weather":"session";
  formState = { mode, editing: id, data: JSON.parse(JSON.stringify(s)) };
  renderForm();
}
function closeForm() {
  document.getElementById("form-overlay").classList.remove("open");
}
function setInstructor(v) {
  readForm(); // preserve date, time, and other fields before re-render
  formState.data.instructor = v;
  if (v !== "__custom__") formState.data.customInstructor = "";
  renderForm();
}
function setCancelReason(v) {
  readForm();
  formState.data.cancelReason = v;
  renderForm();
}

function readForm() {
  const f = formState.data;
  const isClosure = formState.mode === "closure";
  const isAway = formState.mode === "away";
  f.date = document.getElementById("f-date")?.value || "";
  f.notes = document.getElementById("f-notes")?.value || "";

  if (isAway) {
    f.status = "away"; f.time = "00:00"; f.lessonType = "Away / Holiday"; f.durationHrs = 0; f.hobbsLogged = "";
    f.dateEnd = document.getElementById("f-date-end")?.value || "";
  } else if (isClosure) {
    f.status = "closed"; f.time = "00:00"; f.lessonType = "Airfield Closed"; f.durationHrs = 0; f.hobbsLogged = "";
  } else if (formState.mode === "weather") {
    f.status = "weather"; f.time = "00:00"; f.lessonType = "Poor Weather"; f.durationHrs = 0; f.hobbsLogged = "";
  } else {
    f.time = document.getElementById("f-time")?.value || "";
    f.lessonType = document.getElementById("f-type")?.value || f.lessonType;
    f.status = document.getElementById("f-status")?.value || f.status;
    f.aircraft = document.getElementById("f-aircraft")?.value || "";
    f.durationHrs = parseFloat(document.getElementById("f-duration")?.value) || 0;
    f.hobbsLogged = document.getElementById("f-hobbs")?.value || "";
    if (f.instructor === "__custom__") f.customInstructor = document.getElementById("f-custom-inst")?.value || "";
    // Clear cancel reason if not cancelled
    if (f.status !== "cancelled") f.cancelReason = "";
  }
}

function saveForm() {
  readForm();
  const f = formState.data;
  if (!f.date) return;
  if (formState.mode === "session" && !f.time) return;

  // Block booking sessions on away days
  if (formState.mode === "session" && isDateAway(f.date, formState.editing)) {
    alert("You can't book a session on a day you're marked as away. Remove the holiday first if your plans have changed.");
    return;
  }

  if (formState.editing) {
    state.sessions = state.sessions.map(s => s.id === formState.editing ? { ...f, id: formState.editing } : s);
  } else {
    state.sessions.push({ ...f, id: genId() });
  }
  save(); closeForm(); render();
}

function deleteAndClose() {
  if (!confirm("Are you sure you want to delete this session?")) return;
  if (formState.editing) {
    state.sessions = state.sessions.filter(s => s.id !== formState.editing);
    save();
  }
  closeForm(); render();
}

      </div>`;
  } catch (_) {}
}

window.addEventListener("error", (e) => showBootError(e.error || e.message));
window.addEventListener("unhandledrejection", (e) => showBootError(e.reason));

(function boot(){
  const app = document.getElementById("app");
  
  // Listen for login/logout changes
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      // LOGGED IN: Show app
      if (app) app.innerHTML = '<div style="padding:40px; text-align:center; color:#94a3b8; font-family:var(--mono);">Syncing with cloud...</div>';
      try {
        await load();
        if (!Array.isArray(state.sessions) || state.sessions.length === 0) {
          state.sessions = Array.isArray(DEFAULT_SESSIONS) ? DEFAULT_SESSIONS.slice() : [];
        }
        render();
      } catch (e) {
        showBootError(e);
      }
    } else {
      // NOT LOGGED IN: Show Google Sign In Screen
      if (app) {
        app.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; padding:20px; text-align:center;">
            <div style="font-size:48px; margin-bottom:12px;">✈</div>
            <h2 style="color:#e2e8f0; margin-bottom:24px; font-family:var(--font); font-weight:700;">Flight Log</h2>
            <p style="color:#94a3b8; margin-bottom:32px; font-size:14px; max-width:300px;">Please sign in securely with your Google account to access your logbook.</p>
            <button onclick="signIn()" style="background:#fff; color:#0f172a; border:none; padding:12px 24px; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer; display:flex; align-items:center; gap:12px; box-shadow:0 4px 12px rgba(255,255,255,0.1);">
              <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Sign in with Google
            </button>
          </div>
        `;
      }
    }
  });
})();</script>
